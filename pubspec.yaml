name: overseer
description: >-
  Human-in-the-loop testing for generated media and AI output, with YAML matrices,
  interactive checklists, resumable reviews, and Markdown or JSON reports.
version: 1.1.0
repository: https://github.com/Thomasssb1/overseer
topics:
  - testing
  - human-in-the-loop
  - cli
  - ai

environment:
  sdk: "^3.3.0"

dependencies:
  crypto: ^3.0.3
  json_schema: ^5.2.2
  yaml: ^3.1.2
  path: ^1.9.0
  ansi_styles: ^0.3.1
  characters: ^1.3.0
  termunicode: ^0.1.0

dev_dependencies:
  lints: ^6.0.0
  test: ^1.25.6
